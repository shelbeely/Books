name: Build Xteink Zine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------------
  # Primary job: build the EPUB (stable output)
  # ------------------------------------------------------------------
  build-epub:
    name: Build EPUB
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build EPUB
        run: python scripts/build_epub.py

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-epub
          path: build/book.epub
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Experimental job: build native Xteink formats
  # ------------------------------------------------------------------
  build-native:
    name: Build Native (Experimental)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install fonts for page rendering
        run: sudo apt-get install -y fonts-dejavu-core

      - name: Build XTC container (experimental)
        run: python scripts/build_native.py --format xtc --experimental

      - name: Build XTCH container (experimental)
        run: python scripts/build_native.py --format xtch --experimental

      - name: Build XTG pages (experimental)
        run: python scripts/build_native.py --format xtg --experimental

      - name: Build XTH pages (experimental)
        run: python scripts/build_native.py --format xth --experimental

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: book-native-experimental
          path: |
            build/book.xtc
            build/book.xtch
            build/xtg/
            build/xth/
          if-no-files-found: warn
